packages:
  - apps/*
  - packages/*

# Only these deps run install/build scripts. @woovi/node-printer omitted so
# cloud-ui (and other non-POS) deploys don't need cups-config on Linux.
# For local POS/api printing, run: pnpm rebuild @woovi/node-printer
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - printer
  - prisma
  - sharp
  - unrs-resolver
